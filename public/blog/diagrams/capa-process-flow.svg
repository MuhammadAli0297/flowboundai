<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="capaTitle capaDesc">
  <title id="capaTitle">The five lightweight CAPA steps: containment, root cause, corrective action, preventive action, verification</title>
  <desc id="capaDesc">A horizontal flow diagram of five steps: Containment, Root Cause Analysis, Corrective Action, Preventive Action, and Verification, each connected by an arrow to the next.</desc>
  <rect x="1" y="1" width="758" height="418" rx="4" fill="#FFFFFF" stroke="#C0D6DF" stroke-width="1.5" />

  <defs>
    <marker id="capaArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6F7F45" />
    </marker>
  </defs>

  <!-- connecting arrows -->
  <g stroke="#6F7F45" stroke-width="2" marker-end="url(#capaArrow)">
    <line x1="166" y1="190" x2="188" y2="190" />
    <line x1="301" y1="190" x2="323" y2="190" />
    <line x1="436" y1="190" x2="458" y2="190" />
    <line x1="571" y1="190" x2="593" y2="190" />
  </g>

  <!-- step boxes -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <!-- 1 Containment -->
    <rect x="55" y="155" width="110" height="70" rx="4" fill="#6F7F45" fill-opacity="0.12" stroke="#6F7F45" stroke-width="1.5" />
    <circle cx="73" cy="155" r="11" fill="#6F7F45" />
    <text x="73" y="159" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="600">1</text>
    <text x="110" y="195" text-anchor="middle" font-size="12" fill="#104866">Containment</text>

    <!-- 2 Root cause analysis -->
    <rect x="190" y="155" width="110" height="70" rx="4" fill="#6F7F45" fill-opacity="0.12" stroke="#6F7F45" stroke-width="1.5" />
    <circle cx="208" cy="155" r="11" fill="#6F7F45" />
    <text x="208" y="159" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="600">2</text>
    <text x="245" y="188" text-anchor="middle" font-size="12" fill="#104866">Root cause</text>
    <text x="245" y="203" text-anchor="middle" font-size="12" fill="#104866">analysis</text>

    <!-- 3 Corrective action -->
    <rect x="325" y="155" width="110" height="70" rx="4" fill="#6F7F45" fill-opacity="0.12" stroke="#6F7F45" stroke-width="1.5" />
    <circle cx="343" cy="155" r="11" fill="#6F7F45" />
    <text x="343" y="159" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="600">3</text>
    <text x="380" y="188" text-anchor="middle" font-size="12" fill="#104866">Corrective</text>
    <text x="380" y="203" text-anchor="middle" font-size="12" fill="#104866">action</text>

    <!-- 4 Preventive action -->
    <rect x="460" y="155" width="110" height="70" rx="4" fill="#6F7F45" fill-opacity="0.12" stroke="#6F7F45" stroke-width="1.5" />
    <circle cx="478" cy="155" r="11" fill="#6F7F45" />
    <text x="478" y="159" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="600">4</text>
    <text x="515" y="188" text-anchor="middle" font-size="12" fill="#104866">Preventive</text>
    <text x="515" y="203" text-anchor="middle" font-size="12" fill="#104866">action</text>

    <!-- 5 Verification -->
    <rect x="595" y="155" width="110" height="70" rx="4" fill="#6F7F45" fill-opacity="0.22" stroke="#6F7F45" stroke-width="1.5" />
    <circle cx="613" cy="155" r="11" fill="#6F7F45" />
    <text x="613" y="159" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="600">5</text>
    <text x="650" y="195" text-anchor="middle" font-size="12" fill="#104866" font-weight="600">Verification</text>
  </g>
</svg>
