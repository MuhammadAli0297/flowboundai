<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="twmTitle twmDesc">
  <title id="twmTitle">Three-way matching catches a quantity discrepancy before payment</title>
  <desc id="twmDesc">Three documents: a purchase order for 500 units at $2.10 each, a receiving report showing only 480 units actually arrived, and an invoice billing for the full 500. All three feed into a match check. Because the receiving report and invoice disagree on quantity, the match fails and the invoice is held for review instead of being paid automatically.</desc>
  <rect x="1" y="1" width="758" height="418" rx="4" fill="#FFFFFF" stroke="#C0D6DF" stroke-width="1.5" />

  <!-- document cards -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <!-- Purchase Order -->
    <rect x="50" y="40" width="160" height="140" rx="4" fill="#7E9471" fill-opacity="0.1" stroke="#7E9471" stroke-width="1.5" />
    <rect x="50" y="40" width="160" height="30" rx="4" fill="#7E9471" />
    <text x="130" y="60" text-anchor="middle" font-size="11.5" font-weight="600" fill="#FFFFFF">PURCHASE ORDER</text>
    <text x="65" y="92" font-size="12" fill="#104866">Item&#160;&#160;Widget A</text>
    <text x="65" y="114" font-size="12" fill="#104866">Qty&#160;&#160;&#160;&#160;500</text>
    <text x="65" y="136" font-size="12" fill="#104866">Price&#160;&#160;$2.10</text>

    <!-- Receiving Report -->
    <rect x="300" y="40" width="160" height="140" rx="4" fill="#7E9471" fill-opacity="0.1" stroke="#7E9471" stroke-width="1.5" />
    <rect x="300" y="40" width="160" height="30" rx="4" fill="#7E9471" />
    <text x="380" y="60" text-anchor="middle" font-size="11.5" font-weight="600" fill="#FFFFFF">RECEIVING REPORT</text>
    <text x="315" y="92" font-size="12" fill="#104866">Item&#160;&#160;Widget A</text>
    <text x="315" y="114" font-size="12" fill="#104866" font-weight="700">Qty&#160;&#160;&#160;&#160;480</text>
    <text x="315" y="136" font-size="12" fill="#104866" fill-opacity="0.5">Price&#160;&#160;—</text>

    <!-- Invoice -->
    <rect x="550" y="40" width="160" height="140" rx="4" fill="#7E9471" fill-opacity="0.1" stroke="#7E9471" stroke-width="1.5" />
    <rect x="550" y="40" width="160" height="30" rx="4" fill="#7E9471" />
    <text x="630" y="60" text-anchor="middle" font-size="11.5" font-weight="600" fill="#FFFFFF">INVOICE</text>
    <text x="565" y="92" font-size="12" fill="#104866">Item&#160;&#160;Widget A</text>
    <text x="565" y="114" font-size="12" fill="#104866" font-weight="700">Qty&#160;&#160;&#160;&#160;500</text>
    <text x="565" y="136" font-size="12" fill="#104866">Price&#160;&#160;$2.10</text>
  </g>

  <!-- converging lines -->
  <g stroke="#104866" stroke-opacity="0.4" stroke-width="1.5" fill="none">
    <path d="M130,180 L130,210 Q130,222 143,225 L352,250" />
    <line x1="380" y1="180" x2="380" y2="220" />
    <path d="M630,180 L630,210 Q630,222 617,225 L408,250" />
  </g>

  <!-- match diamond -->
  <polygon points="380,220 412,250 380,280 348,250" fill="#FFFFFF" stroke="#104866" stroke-width="1.5" />
  <text x="380" y="254" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#104866">Match?</text>

  <line x1="380" y1="280" x2="380" y2="312" stroke="#104866" stroke-opacity="0.4" stroke-width="1.5" />

  <!-- result -->
  <rect x="200" y="312" width="360" height="72" rx="4" fill="#104866" fill-opacity="0.06" stroke="#104866" stroke-width="1.5" />
  <circle cx="232" cy="348" r="13" fill="#104866" />
  <text x="232" y="353" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#FFFFFF">!</text>
  <text x="258" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#104866" font-weight="600">Quantity mismatch</text>
  <text x="258" y="361" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#104866">480 received vs. 500 invoiced — held for review</text>
</svg>
