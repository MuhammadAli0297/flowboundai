<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="fcTitle fcDesc">
  <title id="fcTitle">Freight class falls as density rises</title>
  <desc id="fcDesc">A step chart with density in pounds per cubic foot on the x-axis and NMFC freight class on the y-axis. Low-density freight around one pound per cubic foot sits at class 400, the most expensive. As density increases, freight class steps down through 300, 200, 150, 100, 85, 70, and 65, reaching class 60 at the highest densities, the cheapest to ship.</desc>
  <rect x="1" y="1" width="758" height="418" rx="4" fill="#FFFFFF" stroke="#C0D6DF" stroke-width="1.5" />

  <!-- axes -->
  <line x1="150" y1="40" x2="150" y2="340" stroke="#104866" stroke-opacity="0.35" stroke-width="1.5" />
  <line x1="150" y1="340" x2="700" y2="340" stroke="#104866" stroke-opacity="0.35" stroke-width="1.5" />
  <text x="150" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="0.06em" fill="#104866" fill-opacity="0.55">FREIGHT CLASS (LOWER = CHEAPER)</text>
  <text x="700" y="366" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="0.06em" fill="#104866" fill-opacity="0.55">DENSITY (LB / FT³) →</text>

  <!-- y tick labels, aligned to the real step heights -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#104866" fill-opacity="0.55" text-anchor="end">
    <text x="140" y="344">50</text>
    <text x="140" y="304.5">100</text>
    <text x="140" y="226">200</text>
    <text x="140" y="148">300</text>
    <text x="140" y="69.5">400</text>
  </g>
  <g stroke="#C0D6DF" stroke-width="1">
    <line x1="150" y1="340" x2="700" y2="340" />
    <line x1="150" y1="300.8" x2="700" y2="300.8" />
    <line x1="150" y1="222.4" x2="700" y2="222.4" />
    <line x1="150" y1="144.1" x2="700" y2="144.1" />
    <line x1="150" y1="65.7" x2="700" y2="65.7" />
  </g>

  <!-- area fill under the step line -->
  <path d="M150.0,65.7 L158.0,65.7 L158.0,144.1 L173.9,144.1 L173.9,222.4 L205.8,222.4 L205.8,261.6 L237.7,261.6 L237.7,300.8 L301.4,300.8 L301.4,312.6 L381.2,312.6 L381.2,324.3 L500.7,324.3 L500.7,328.2 L620.3,328.2 L620.3,332.2 L700.0,332.2 L700.0,340 L150.0,340 Z"
        fill="#96742E" fill-opacity="0.12" />

  <!-- step line -->
  <path d="M150.0,65.7 L158.0,65.7 L158.0,144.1 L173.9,144.1 L173.9,222.4 L205.8,222.4 L205.8,261.6 L237.7,261.6 L237.7,300.8 L301.4,300.8 L301.4,312.6 L381.2,312.6 L381.2,324.3 L500.7,324.3 L500.7,328.2 L620.3,328.2 L620.3,332.2 L700.0,332.2"
        fill="none" stroke="#96742E" stroke-width="3" stroke-linejoin="round" />

  <!-- callouts -->
  <circle cx="154.0" cy="65.7" r="5" fill="#96742E" stroke="#FFFFFF" stroke-width="1.5" />
  <text x="190" y="50" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#104866">Class 400 — low density, expensive</text>

  <circle cx="660.1" cy="332.2" r="5" fill="#96742E" stroke="#FFFFFF" stroke-width="1.5" />
  <text x="625" y="317" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#104866">Class 60 — dense, cheap to ship</text>
</svg>
